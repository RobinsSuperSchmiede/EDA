<!doctype html>
<!-- Development view: the production page (index.html) in a frame, plus a customize bar.
     Serve the folder (python -m http.server) – the bar needs same-origin access to the frame. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenShell – dev</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --panel: #141518;
        --raised: #1f2024;
        --line: rgba(255, 255, 255, 0.08);
        --text-1: #ededed;
        --text-2: #a1a1a6;
        --text-3: #85858b;
        --glass: rgba(255, 255, 255, 0.08);
        --seg-on: rgba(255, 255, 255, 0.16);
        --sheen: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        font-family: Geist, system-ui, sans-serif;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0c0e;
        overflow: hidden;
      }
      .viewport {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: stretch;
      }
      .viewport iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
        transition: width 300ms var(--ease);
      }
      .viewport[data-size="tablet"] iframe {
        width: 820px;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .viewport[data-size="mobile"] iframe {
        width: 390px;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }

      /* ---------------------------------------------------------------- customize bar */
      .devbar {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        width: 304px;
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(20, 21, 24, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        color: var(--text-1);
        font-size: 13px;
      }
      .devbar.collapsed {
        width: auto;
        padding: 8px;
      }
      .devbar.collapsed .body {
        display: none;
      }
      .devbar header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .devbar.collapsed header .title {
        display: none;
      }
      .devbar .title {
        font-weight: 500;
      }
      .devbar .title small {
        margin-left: 8px;
        font-family: "Geist Mono", monospace;
        font-size: 11px;
        font-weight: 400;
        color: var(--text-3);
      }
      .live {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4cc38a;
      }
      .icon-btn {
        margin-left: auto;
        height: 24px;
        padding: 0 10px;
        border: 0;
        border-radius: 999px;
        background: var(--glass);
        box-shadow: var(--sheen);
        color: var(--text-2);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .devbar.collapsed .icon-btn {
        margin-left: 0;
      }
      .field {
        margin-top: 16px;
      }
      .field > label,
      .field > .label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--text-2);
      }
      .field .value {
        font-family: "Geist Mono", monospace;
        color: var(--text-3);
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
      }
      .swatch {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--text-2);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: background-color 160ms var(--ease), color 160ms var(--ease);
      }
      .swatch:hover {
        background: var(--raised);
        color: var(--text-1);
      }
      .swatch[aria-pressed="true"] {
        border-color: var(--line);
        background: var(--raised);
        color: var(--text-1);
      }
      .swatch i {
        width: 12px;
        height: 12px;
        flex: none;
        border-radius: 50%;
        background: var(--c);
      }
      .seg {
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: 999px;
        background: var(--glass);
        box-shadow: var(--sheen);
      }
      .seg button {
        flex: 1;
        height: 24px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--text-2);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: background-color 160ms var(--ease), color 160ms var(--ease);
      }
      .seg button[aria-pressed="true"] {
        background: var(--seg-on);
        color: var(--text-1);
        box-shadow: var(--sheen);
      }
      input[type="range"] {
        width: 100%;
        accent-color: #ededed;
      }
      .prod {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .prod code {
        display: block;
        padding: 8px;
        border-radius: 8px;
        background: #0b0c0e;
        font-family: "Geist Mono", monospace;
        font-size: 11px;
        line-height: 1.5;
        color: var(--text-2);
        word-break: break-all;
      }
      .prod .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .prod .row button {
        margin-left: 0;
      }
      .prod p {
        margin: 8px 0 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-3);
      }
      kbd {
        padding: 0 4px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-family: "Geist Mono", monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="viewport" id="viewport" data-size="desktop">
      <iframe id="site" src="index.html" title="OpenShell landing page"></iframe>
    </div>

    <aside class="devbar" id="devbar" aria-label="Customize">
      <header>
        <span class="live" aria-hidden="true"></span>
        <span class="title">Customize<small>dev</small></span>
        <button class="icon-btn" type="button" id="toggle" title="Show or hide (press .)">Hide</button>
      </header>
      <div class="body">
        <div class="field">
          <div class="label">Color</div>
          <div class="swatches" id="themes"></div>
        </div>
        <div class="field">
          <div class="label">Hero</div>
          <div class="seg" data-setting="hero">
            <button type="button" data-value="wordmark">Wordmark</button>
            <button type="button" data-value="stage">App window</button>
          </div>
        </div>
        <div class="field">
          <div class="label">Surface</div>
          <div class="seg" data-setting="surface">
            <button type="button" data-value="tinted">Tinted</button>
            <button type="button" data-value="ink">Ink</button>
          </div>
        </div>
        <div class="field">
          <div class="label">ASCII field</div>
          <div class="seg" data-setting="field">
            <button type="button" data-value="hero">Hero</button>
            <button type="button" data-value="page">Page</button>
            <button type="button" data-value="off">Off</button>
          </div>
        </div>
        <div class="field">
          <div class="label">Behind text</div>
          <div class="seg" data-setting="calm">
            <button type="button" data-value="on">Calm</button>
            <button type="button" data-value="off">ASCII</button>
          </div>
        </div>
        <div class="field">
          <label for="intensity">Intensity <span class="value" id="intensity-value">1.0</span></label>
          <input type="range" id="intensity" min="0.4" max="1.4" step="0.1" />
        </div>
        <div class="field">
          <div class="label">Motion</div>
          <div class="seg" data-setting="motion">
            <button type="button" data-value="on">On</button>
            <button type="button" data-value="off">Off</button>
          </div>
        </div>
        <div class="field">
          <div class="label">Viewport</div>
          <div class="seg" data-setting="size">
            <button type="button" data-value="desktop">Desktop</button>
            <button type="button" data-value="tablet">Tablet</button>
            <button type="button" data-value="mobile">Mobile</button>
          </div>
        </div>
        <div class="prod">
          <div class="field" style="margin-top: 0">
            <div class="label">Production line</div>
            <code id="prod-line"></code>
          </div>
          <div class="row">
            <button class="icon-btn" type="button" id="copy-prod">Copy</button>
            <button class="icon-btn" type="button" id="reset">Reset to prod</button>
          </div>
          <p>Replace line 3 of <span style="font-family: 'Geist Mono', monospace">website/index.html</span> with it to ship this look. <kbd>.</kbd> hides the bar.</p>
        </div>
      </div>
    </aside>

    <script src="assets/dev.js"></script>
  </body>
</html>
