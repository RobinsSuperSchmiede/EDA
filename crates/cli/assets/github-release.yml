# Release workflow for an OpenShell app – generated by `openshell release workflow`.
#
# Push a tag like v1.2.0 and GitHub builds, in parallel:
#   - Windows installer (NSIS), macOS disk images (Apple Silicon and Intel), Linux AppImage + .deb
#   - the portable app bundle (.osapp) for Android (OpenShell app / Termux), servers and any other host
# and publishes them with downloads.json and a download page (index.html) as a GitHub release.
# Users get one link per system: https://github.com/<owner>/<repo>/releases/latest
#
# Optional code signing – add these repository secrets and they are used automatically:
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#            (and package.signing.windows.certificate_thumbprint in openshell.json)
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID  (signing + notarisation)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENSHELL_VERSION: "__OPENSHELL_VERSION__"

jobs:
  installers:
    name: Installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, target: x86_64-pc-windows-msvc, formats: nsis }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, formats: dmg }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin, formats: dmg }
          - { name: linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, formats: "appimage deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Add the toolchains your app's build steps need (frontend.build, services[].build), e.g.:
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - uses: actions/setup-python@v5
      #   with: { python-version: "3.13" }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libfuse2 file
      - name: Install OpenShell
        shell: bash
        run: |
          ext=tar.gz; [ "${{ runner.os }}" = "Windows" ] && ext=zip
          url="https://github.com/RobinsSuperSchmiede/EDA/releases/download/v${OPENSHELL_VERSION}/openshell-${{ matrix.target }}.$ext"
          curl -fsSL "$url" -o openshell.$ext
          if [ "$ext" = zip ]; then 7z x openshell.zip -o"$RUNNER_TEMP" > /dev/null; else tar xzf openshell.tar.gz -C "$RUNNER_TEMP"; fi
          echo "$RUNNER_TEMP/openshell-${{ matrix.target }}" >> "$GITHUB_PATH"
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
      - name: Build installers
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          targets=""; for f in ${{ matrix.formats }}; do targets="$targets --target $f"; done
          openshell package $targets --out dist
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  bundle:
    name: App bundle (.osapp – Android, Termux, servers)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenShell
        run: curl -fsSL https://raw.githubusercontent.com/RobinsSuperSchmiede/EDA/main/scripts/install.sh | OPENSHELL_VERSION="v${OPENSHELL_VERSION}" sh
      - name: Build the bundle
        run: ~/.openshell/bin/openshell package --target bundle --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/*.osapp
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [installers, bundle]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install OpenShell
        run: curl -fsSL https://raw.githubusercontent.com/RobinsSuperSchmiede/EDA/main/scripts/install.sh | OPENSHELL_VERSION="v${OPENSHELL_VERSION}" sh
      - name: downloads.json and download page
        run: |
          ~/.openshell/bin/openshell release manifest dist \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
