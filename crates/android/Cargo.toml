[package]
name = "openshell-android"
description = "JNI bridge of the OpenShell Android app: runs the unchanged core in the app process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "openshell_android"
# cdylib: libopenshell_android.so for the APK; rlib: tests and other hosts
crate-type = ["cdylib", "rlib"]

[dependencies]
openshell-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile.workspace = true
